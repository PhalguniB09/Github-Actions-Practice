name: Auto Linter

on:
  push:
    paths: "*.py"
    
jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout/clone the code
        uses: actions/checkout@v7

      - name: install linter
        run: pip install ruff

      - name: check the files for linting
        ruff check .
      
